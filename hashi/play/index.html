		<!-- Before the first paint: the street's sky for this hour (site/sky.ts, which
		     sky.test.ts holds this copy to), and whether today's sway has played. -->
		<script>
			(() => {
				const d = new Date();
				const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
				const swing = 1.25 * Math.cos((2 * Math.PI * (doy - 172)) / 365);
				const set = 17.75 + swing;
				const rise = 5.6 - swing;
				const h = d.getHours() + d.getMinutes() / 60;
				document.documentElement.dataset.sky =
					h >= rise - 0.75 && h < rise + 0.75
						? 'dawn'
						: h >= rise + 0.75 && h < set - 1.25
							? 'day'
							: h >= set - 1.25 && h < set
								? 'golden'
								: h >= set && h < set + 1
									? 'dusk'
									: 'night';
				try {
					const day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
					if (localStorage.getItem('street.swayed') === day)
						document.documentElement.dataset.swayed = '';
				} catch {}
			})();
		</script>
